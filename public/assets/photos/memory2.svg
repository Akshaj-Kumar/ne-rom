<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" rx="12" fill="url(#bg2)"/>
  <circle cx="200" cy="210" r="130" fill="url(#moonGlow)"/>
  <!-- Stars -->
  <circle cx="90" cy="90" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="320" cy="80" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="360" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="330" cy="350" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Moon / Stars Icon -->
  <g transform="translate(200, 200) scale(1.6)">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" transform="translate(-12, -12)" fill="#ffffff" opacity="0.95"/>
  </g>
  <text x="200" y="310" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Midnight Whispers
  </text>
  <text x="200" y="340" font-family="'Poppins', sans-serif" font-size="13" fill="#f3e8ff" text-anchor="middle" opacity="0.85">
    When the world is quiet & you're with me
  </text>
